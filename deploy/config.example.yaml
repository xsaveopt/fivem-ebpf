# gameshield-ebpf runtime config.

# Network interface the XDP dispatcher attaches to. Find via `ip -br link`.
iface: eth0

# cgroup v2 root. Change only for containerized deployments.
cgroup_path: /sys/fs/cgroup

# BPF map pin root. Survives process restart; cleared on reboot.
pin_root: /sys/fs/bpf/gameshield

# Prometheus /metrics listen address.
metrics_addr: ":9464"

# How often to refresh map-entry gauges. Iterating 100k-entry LRU maps every
# scrape is too expensive; this background ticker amortizes the cost.
map_size_interval: 30s

modules:
  fivem:
    enabled: true
    port: 30120
    whitelist_ttl: 10m

    udp_rate_per_sec: 1500
    udp_burst: 4500

    initconnect_per_min: 6
    initconnect_burst: 3

    getinfo_per_min: 6
    getinfo_burst: 5

    tcp_global_rate_per_sec: 5000
    tcp_global_burst: 15000

    tcp_max_open_per_ip: 16

    health_window: 60s
    health_threshold: 100
    health_blacklist: 5m
